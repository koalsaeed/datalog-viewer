name: Build Android APK

# Runs on every push, or manually from the Actions tab.
on:
  push:
  workflow_dispatch:

jobs:
  # The viewer page the app loads, tested in Chromium on real sample logs. No APK is
  # built unless these pass.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Cache sample logs
        uses: actions/cache@v4
        with:
          path: tests/.cache/fixtures
          key: fixtures-${{ hashFiles('tests/fixtures/manifest.json') }}

      - name: Install test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # newer Android lint calls Java 21 APIs (List.removeLast)

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The android/ folder is generated by the SDK, so it does not need to be
      # committed. It is scaffolded into a temp directory and copied in, which
      # leaves lib/ and pubspec.yaml untouched.
      - name: Scaffold the Android platform folder
        run: |
          flutter create \
            --platforms=android \
            --project-name datalog_viewer \
            --org com.datalog \
            /tmp/scaffold
          cp -r /tmp/scaffold/android .

      - name: App icon and label
        run: |
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            cp "assets/icon/icon-$2.png" "android/app/src/main/res/mipmap-$1/ic_launcher.png"
          done
          sed -i 's/android:label="[^"]*"/android:label="PWP datalogger"/' android/app/src/main/AndroidManifest.xml
          grep -o 'android:label="[^"]*"' android/app/src/main/AndroidManifest.xml
          # The viewer page loads its fonts from Google Fonts.
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -c 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: datalog-viewer-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
