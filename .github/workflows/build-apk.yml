name: Build Android APK

# Runs on every push, or manually from the Actions tab.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The android/ folder is generated by the SDK, so it does not need to be
      # committed. It is scaffolded into a temp directory and copied in, which
      # leaves lib/ and pubspec.yaml untouched.
      - name: Scaffold the Android platform folder
        run: |
          flutter create \
            --platforms=android \
            --project-name datalog_viewer \
            --org com.datalog \
            /tmp/scaffold
          cp -r /tmp/scaffold/android .

      - name: App icon and label
        run: |
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            cp "assets/icon/icon-$2.png" "android/app/src/main/res/mipmap-$1/ic_launcher.png"
          done
          sed -i 's/android:label="[^"]*"/android:label="PWP datalogger"/' android/app/src/main/AndroidManifest.xml
          grep -o 'android:label="[^"]*"' android/app/src/main/AndroidManifest.xml

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: datalog-viewer-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
