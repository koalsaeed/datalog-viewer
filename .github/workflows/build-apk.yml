name: Build Android APK

# Manual only: Actions tab → Build Android APK → Run workflow (or on request). It runs the
# tests first and builds the APK only when they pass.
on:
  workflow_dispatch:

# Publishing the APK as a release needs write access to the repository's contents.
permissions:
  contents: write

jobs:
  # The viewer page the app loads, tested in Chromium on real sample logs. No APK is
  # built unless these pass.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Cache sample logs
        uses: actions/cache@v4
        with:
          path: tests/.cache/fixtures
          key: fixtures-${{ hashFiles('tests/fixtures/manifest.json') }}

      - name: App page matches its source
        working-directory: .
        run: viewer/build.sh --check

      - name: Install test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # newer Android lint calls Java 21 APIs (List.removeLast)

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The android/ folder is generated by the SDK, so it does not need to be
      # committed. It is scaffolded into a temp directory and copied in, which
      # leaves lib/ and pubspec.yaml untouched.
      - name: Scaffold the Android platform folder
        run: |
          flutter create \
            --platforms=android \
            --project-name datalog_viewer \
            --org com.datalog \
            /tmp/scaffold
          cp -r /tmp/scaffold/android .

      - name: App icon and label
        run: |
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            cp "assets/icon/icon-$2.png" "android/app/src/main/res/mipmap-$1/ic_launcher.png"
          done
          rm -rf android/app/src/main/res/mipmap-anydpi*   # an adaptive icon there would replace ours on Android 8+
          sed -i 's/android:label="[^"]*"/android:label="PWP Log Viewer"/' android/app/src/main/AndroidManifest.xml
          grep -o 'android:label="[^"]*"' android/app/src/main/AndroidManifest.xml
          # The viewer page loads its fonts from Google Fonts.
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -c 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk PWP-Log-Viewer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: datalog-viewer-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # A public download for testers, no GitHub account needed. The newest build is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/PWP-Log-Viewer.apk
      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: PWP Log Viewer · test build ${{ github.run_number }}
          body: |
            Test build of PWP Log Viewer for Android. Download PWP-Log-Viewer.apk below and open it on the phone.
            Remove an older test build first: each build is signed with a new key, so it cannot install over the last one.
          files: PWP-Log-Viewer.apk
          make_latest: true
